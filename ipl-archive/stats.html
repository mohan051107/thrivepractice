<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; connect-src 'self';">

<header class="site-header">

    <a class="active" href="stats.html">Stats 2008–2026</a>

      <tbody id="statsBody"></tbody>
    </table>
  </div>
  <p id="resultCount" class="result-count"></p>
